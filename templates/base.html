<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartVoca 단어장{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="brand" href="{{ url_for('index') }}">SmartVoca</a>
      <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">홈</a>
        <a href="{{ url_for('words.list_words') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('words.') }}">단어 목록</a>
        <a href="{{ url_for('study.today') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('study.') }}">오늘 암기</a>
        <a href="{{ url_for('exam.new_form') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('exam.') }}">시험</a>
        <a href="{{ url_for('stats.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('stats.') }}">통계</a>
        <a href="{{ url_for('ranking.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('ranking.') }}">순위표</a>
        <a href="{{ url_for('settings.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings.') }}">설정</a>
      </nav>
      <div style="display:flex; align-items:center; gap:8px;">
        {% if current_user %}
          <span class="chip chip-primary">{{ current_user['username'] }}</span>
          <form method="post" action="{{ url_for('auth.logout') }}" style="margin:0;">
            <button type="submit" class="btn-outlined btn-sm">로그아웃</button>
          </form>
        {% else %}
          <a class="btn btn-tonal btn-sm" href="{{ url_for('auth.login_form') }}">로그인</a>
          <a class="btn btn-outlined btn-sm" href="{{ url_for('auth.register_form') }}">회원가입</a>
        {% endif %}
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
