<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartVoca 단어장{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="brand" href="{{ url_for('index') }}">SmartVoca</a>
      <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">홈</a>
        <a href="{{ url_for('words.list_words') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('words.') }}">단어 목록</a>
        <a href="{{ url_for('study.today') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('study.') }}">오늘 암기</a>
        <a href="{{ url_for('exam.new_form') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('exam.') }}">시험</a>
        <a href="{{ url_for('stats.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('stats.') }}">통계</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
