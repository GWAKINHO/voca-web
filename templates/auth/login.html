{% extends "base.html" %}
{% block title %}로그인 · SmartVoca{% endblock %}
{% block content %}
<div style="max-width:440px; margin:20px auto 0;">
  <h1>로그인</h1>
  <p class="subtitle">계정으로 로그인하면 암기·시험 이력과 설정이 계정별로 저장됩니다.</p>

  {% if msg %}<div class="banner msg">{{ msg }}</div>{% endif %}
  {% if err %}<div class="banner err-banner">{{ err }}</div>{% endif %}

  <form class="card" method="post" action="{{ url_for('auth.login') }}">
    <div class="field" style="margin-bottom:14px;">
      <label for="login-username">아이디</label>
      <input id="login-username" type="text" name="username" required autocomplete="username" placeholder="아이디 입력">
    </div>
    <div class="field" style="margin-bottom:20px;">
      <label for="login-password">비밀번호</label>
      <input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="비밀번호 입력">
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button type="submit">로그인</button>
      <a class="btn btn-tonal" href="{{ url_for('auth.register_form') }}">회원가입</a>
    </div>
  </form>
</div>
{% endblock %}
